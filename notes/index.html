<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes | LogHue</title>

    <!--SCYBUD UI-->
    <link rel="stylesheet" href="https://ui.scybud.com/css/variables.css" />
    <link rel="stylesheet" href="https://ui.scybud.com/css/layout.css" />
    <link
      rel="stylesheet"
      href="https://ui.scybud.com/components/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="https://ui.scybud.com/components/buttons/nav-buttons.css"
    />
    <link rel="stylesheet" href="https://ui.scybud.com/css/typography.css" />
    <link rel="stylesheet" href="https://ui.scybud.com/css/animations.css" />

    <!-- Quill CSS -->
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />

    <!--APP SPECIFIC CSS-->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="https://app.loghue.com/css/component.css" />
    <link rel="stylesheet" href="https://app.loghue.com/css/dashboard.css" />
    <link rel="stylesheet" href="https://app.loghue.com/css/components/quill.css" />
    <link rel="stylesheet" href="../css/notes/index.css" />
    <link rel="stylesheet" href="https://app.loghue.com/css/components/search.css" />
    <link rel="stylesheet" href="https://app.loghue.com/css/components/command-palette.css" />
    <link rel="stylesheet" href="https://app.loghue.com/css/components/notes-tables.css" />

    <!--FAVICONS-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://app.loghue.com/assets/icons/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://app.loghue.com/assets/icons/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="https://app.loghue.com/assets/icons/favicons/favicon-16x16.png"
    />
  </head>

  <body>
    <main class="main">
      <!-- MAIN CONTENT -->
      <article class="mainContent" id="notesContent">
        <div id="modalContainer"></div>
        <div id="actionsMessage"></div>
        <div id="infoDisplay"></div>

        <p class="danger"></p>

        <section class="notesListContainer">
          <!-- LEFT: Notes List -->
          <div id="notesListContainer">
            <div class="sectionHeader">
              <div class="sectionHeaderLeft">
                <h2>All Notes</h2>
                <span id="notesCount" class="notesCount">0</span>
              </div>

              <div class="noteActions">
                <div class="newNoteActionContainer" id="newNoteActionContainer">
                  <button
                    onclick="notesTypeSelectContainer.hidden ^= 1"
                    class="btn actionBtn"
                    type="button"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.2"
                      stroke-linecap="round"
                    >
                      <line x1="12" y1="5" x2="12" y2="19" />
                      <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Create
                  </button>

                  <div
                    class="dropdown notesTypeSelectContainer"
                    id="notesTypeSelectContainer"
                    hidden
                  >
                    <div class="dropdown-list">
                      <button id="createNote" class="btn" type="button">
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path
                            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                          />
                          <polyline points="14 2 14 8 20 8" />
                          <line x1="16" y1="13" x2="8" y2="13" />
                          <line x1="16" y1="17" x2="8" y2="17" />
                          <line x1="10" y1="9" x2="8" y2="9" />
                        </svg>
                        New Note
                      </button>

                      <button id="createSketch" class="btn" type="button">
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="M12 20h9" />
                          <path
                            d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"
                          />
                        </svg>
                        New Sketch
                      </button>

                      <button id="createTable" class="btn" type="button">
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <rect x="3" y="4" width="18" height="16" rx="2" />
                          <path d="M3 10h18M9 4v16" />
                        </svg>
                        New Table
                      </button>

                      <div class="dropdown-divider"></div>

                      <button id="createFolder" class="btn" type="button">
                        <svg
                          width="16"
                          height="16"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.8"
                        >
                          <path d="M3 7h6l2 2h10v10H3z" />
                        </svg>
                        New Folder
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            <div id="notesList">
              <p class="placeholderText">No notes created yet.</p>
            </div>
          </div>
        </section>
      </article>
    </main>

    <!--
      <script type="module" src="https://app.loghue.com/js/utils/noAuthSessionProtect.js"></script>
      -->
    <script type="module" src="../js/app.js" defer></script>
<script type="module" src="../js/notes.js"></script>

    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- HTML TO PDF -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
      defer
    ></script>
    <!-- HTML TO DOCX -->
    <script
      src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"
      defer
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"
      defer
    ></script>

  </body>
</html>
